name: Release PR

on:
  push:
    branches: ['release/**']

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  release-pr:
    name: Release PR
    runs-on: ubuntu-latest
    steps:
      # A PAT is needed: PRs created with GITHUB_TOKEN do not trigger the required pull_request checks.
      - uses: GravionLabs/ci/versioning/release-pr@main
        with:
          token: ${{ secrets.GH_PAT || github.token }}
      # Labels issues merged into the release branch with `merged` (removed when the release closes them).
      - uses: GravionLabs/ci/versioning/mark-merged-issues@main
        with:
          token: ${{ secrets.GH_PAT || github.token }}
      # Sets the project Status of the issues those PRs close or reference to `In release`. Needs a classic PAT with
      # scope `project` (secret PROJECT_TOKEN, else GH_PAT); fine-grained tokens cannot access user-owned projects.
      # Without a token only the label is set. Never fails the job.
      - name: Set project status In release
        id: in-release
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN || secrets.GH_PAT }}
        run: |
          set -o pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::warning::no token with scope project (secret PROJECT_TOKEN or GH_PAT); label only"
            exit 0
          fi
          owner="${GITHUB_REPOSITORY%%/*}"; repo="${GITHUB_REPOSITORY##*/}"
          # Merged PRs of the pushed commit whose base is the pushed branch.
          prs=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" --paginate \
            --jq '.[] | select(.merged_at != null and .base.ref == env.GITHUB_REF_NAME) | .number') || {
            echo "::warning::cannot list pull requests of $GITHUB_SHA; project status not set"
            exit 0
          }
          # keyword, then one or more `#n` (`Closes #1, #2 and #3`); the keyword must start a word (not `prefix #9`)
          ref='(^|[^[:alnum:]_])(close[sd]?|fix(e[sd])?|resolve[sd]?|refs?|references?)[: ]+#[0-9]+([, ]+(and +)?#[0-9]+)*'
          issues=""
          for pr in $prs; do
            # Issues the PR closes plus those it names with a keyword in body or commits (`Refs #n`), like the label step.
            closing=$(gh api graphql --paginate -f owner="$owner" -f repo="$repo" -F pr="$pr" -f query='
              query($owner:String!,$repo:String!,$pr:Int!,$endCursor:String){repository(owner:$owner,name:$repo){pullRequest(number:$pr){
                closingIssuesReferences(first:50,after:$endCursor){nodes{number} pageInfo{hasNextPage endCursor}}}}}' \
              --jq '.data.repository.pullRequest.closingIssuesReferences.nodes[].number') || {
              echo "::warning::cannot read issues closed by PR #$pr"; closing=""
            }
            body=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$pr" --jq '.body // ""') || body=""
            commits=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$pr/commits" --paginate --jq '.[].commit.message') || commits=""
            named=$(printf '%s\n%s\n' "$body" "$commits" | grep -ioE "$ref" | grep -oE '[0-9]+') || named=""
            issues="$issues $closing $named"
          done
          err=$(mktemp)
          for issue in $(printf '%s\n' $issues | sort -un); do
            items=$(gh api graphql --paginate -f owner="$owner" -f repo="$repo" -F issue="$issue" -f query='
              query($owner:String!,$repo:String!,$issue:Int!,$endCursor:String){repository(owner:$owner,name:$repo){issue(number:$issue){
                projectItems(first:20,after:$endCursor){nodes{id project{id number
                  field(name:"Status"){... on ProjectV2SingleSelectField{id options{id name}}}}
                  fieldValueByName(name:"Status"){... on ProjectV2ItemFieldSingleSelectValue{name}}}
                  pageInfo{hasNextPage endCursor}}}}}' \
              --jq '.data.repository.issue.projectItems.nodes[] | tojson' 2>"$err") || {
              cat "$err" >&2
              # Every issue fails the same way: the token has no scope `project` (or is fine-grained; those cannot
              # access user-owned projects). Say so once instead of one warning per issue.
              if grep -q 'Resource not accessible' "$err"; then
                echo "::warning::token cannot access the project (classic PAT with scope project needed; fine-grained tokens cannot access user-owned projects); project status not set"
                exit 0
              fi
              echo "::warning::cannot read project items of #$issue"
              continue
            }
            if [ -z "$items" ]; then echo "::notice::#$issue has no project item; skipped"; continue; fi
            while IFS= read -r item; do
              number=$(jq -r '.project.number' <<<"$item")
              status=$(jq -r '.fieldValueByName.name // ""' <<<"$item")
              if [ "$status" = "Done" ] || [ "$status" = "In release" ]; then
                echo "::notice::#$issue in project $number is already '$status'; skipped"; continue
              fi
              option=$(jq -r '[.project.field.options[]? | select(.name == "In release") | .id][0] // ""' <<<"$item")
              if [ -z "$option" ]; then
                echo "::warning::project $number has no Status option 'In release'; #$issue skipped"; continue
              fi
              gh api graphql -f project="$(jq -r '.project.id' <<<"$item")" -f item="$(jq -r '.id' <<<"$item")" \
                -f field="$(jq -r '.project.field.id' <<<"$item")" -f option="$option" -f query='
                mutation($project:ID!,$item:ID!,$field:ID!,$option:String!){updateProjectV2ItemFieldValue(input:{
                  projectId:$project,itemId:$item,fieldId:$field,value:{singleSelectOptionId:$option}}){projectV2Item{id}}}' >/dev/null \
                && echo "#$issue in project $number set to In release" \
                || echo "::warning::could not set Status of #$issue in project $number"
            done <<<"$items"
          done
