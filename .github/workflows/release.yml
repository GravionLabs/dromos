# Release on main (apm-hub convention): the version comes from GitVersion (GitVersion.yml, release/next increments
# Minor), gh-release tags, regenerates CHANGELOG.md with git-cliff (cliff.toml), publishes the GitHub Release and
# closes the issues labelled `merged` (set by release-pr.yml when their PRs merged into release/next).
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  determine-version:
    name: Determine Version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      semver: ${{ steps.version.outputs.semver }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version
        id: version
        uses: GravionLabs/ci/versioning/determine-version@main
        with:
          gitversion-config-file: GitVersion.yml

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: determine-version
    permissions:
      contents: write
      issues: write
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT || github.token }}

      - name: Create GitHub Release
        uses: GravionLabs/ci/versioning/gh-release@main
        with:
          token: ${{ secrets.GH_PAT || github.token }}
          version: ${{ needs.determine-version.outputs.semver }}
          changelog-file: CHANGELOG.md
          cliff-config: cliff.toml
          update-changelog: 'true'

  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: [determine-version, release]
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: v${{ needs.determine-version.outputs.semver }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: Install and build
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Set package version
        run: npm version "${{ needs.determine-version.outputs.semver }}" --no-git-tag-version

      - name: Publish
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "::notice::$name@$version is already on npm, skipping publish"
          else
            npm publish --provenance --access public
          fi
