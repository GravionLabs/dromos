name: Epic
description: A large body of work spanning multiple features, tied to a spec/ADR.
title: "[Epic] "
labels: ["epic"]
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What outcome does this epic deliver?
    validations:
      required: true
  - type: input
    id: spec
    attributes:
      label: Related spec/ADR
      description: Link to the doc under docs/specs/ or docs/adr/
    validations:
      required: true
  - type: markdown
    attributes:
      value: |
        Add Feature children via GitHub's native **sub-issues** panel on this issue (not a manual checklist) — it keeps progress and completion % in sync automatically.
