name: Bug
description: Something is broken.
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Check [docs/decisions](https://github.com/GravionLabs/dromos/tree/main/docs/decisions) and [docs/out-of-scope](https://github.com/GravionLabs/dromos/tree/main/docs/out-of-scope) before proposing, so settled decisions are not re-opened.
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs actual
    validations:
      required: true
  - type: input
    id: area
    attributes:
      label: Area
      description: frontend / gateway / bff / realtime / business-backend / infra
  - type: markdown
    attributes:
      value: |
        If this bug needs to be broken into multiple Tasks, add them as children via GitHub's native **sub-issues** panel on this issue.
